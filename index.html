<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I❤仕組み</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --red: #E94C3D; --red-light: #ffeeed; --bg: #f7f5f2; --surface: #ffffff; --text: #1a1a1a; --text-muted: #6b6b6b; --border: #e0ddd8; --tab-hover-bg: #eeebe6; --radius: 12px; }
  body { font-family: 'DM Sans', 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; height: 60px; }
  .logo { display: flex; align-items: center; text-decoration: none; }
  .logo svg { display: block; }
  nav.header-nav a { font-size: 0.875rem; color: var(--text-muted); text-decoration: none; transition: color 0.15s; }
  nav.header-nav a:hover { color: var(--text); }
  .tab-section { background: var(--surface); border-bottom: 1px solid var(--border); }
  .tab-row { display: flex; align-items: stretch; padding: 0 2rem; overflow-x: auto; scrollbar-width: none; }
  .tab-row::-webkit-scrollbar { display: none; }
  .tab-row + .tab-row { border-top: 1px solid var(--border); }
  .row-label { display: flex; align-items: center; padding: 0 1rem 0 0; font-size: 0.72rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; letter-spacing: 0.4px; border-right: 1px solid var(--border); margin-right: 0.5rem; min-width: 72px; }
  .row-label.before { color: #2563eb; }
  .row-label.after { color: #16a34a; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 0 1.1rem; height: 44px; font-size: 0.875rem; font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 2.5px solid transparent; transition: color 0.15s, border-color 0.15s, background 0.15s; white-space: nowrap; user-select: none; }
  .tab:hover { color: var(--text); background: var(--tab-hover-bg); }
  .tab.active { color: var(--red); border-bottom-color: var(--red); }
  main { max-width: 900px; margin: 0 auto; padding: 3rem 2rem; }
  .tool-panel { display: none; animation: fadeIn 0.2s ease; }
  .tool-panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .panel-hero { text-align: center; margin-bottom: 2.5rem; }
  .panel-hero h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.6rem; letter-spacing: -0.5px; }
  .panel-hero p { font-size: 1rem; color: var(--text-muted); line-height: 1.65; max-width: 580px; margin: 0 auto; }
  .panel-hero .tag-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 0.9rem; }
  .tag { background: var(--red-light); color: var(--red); padding: 3px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 700; }
  .dropzone { border: 2px dashed var(--border); border-radius: var(--radius); background: var(--surface); min-height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; cursor: pointer; transition: border-color 0.2s, background 0.2s; padding: 2.5rem; }
  .dropzone:hover { border-color: var(--red); background: var(--red-light); }
  .dropzone .dz-icon { width: 56px; height: 56px; background: var(--red-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .dropzone .dz-icon svg { width: 26px; height: 26px; color: var(--red); }
  .dropzone .dz-label { font-size: 1rem; font-weight: 600; }
  .dropzone .dz-sub { font-size: 0.85rem; color: var(--text-muted); }
  .dropzone .btn-select { background: var(--red); color: #fff; border: none; border-radius: 8px; padding: 0.6rem 1.5rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: opacity 0.15s; }
  .dropzone .btn-select:hover { opacity: 0.88; }
  footer { text-align: center; padding: 2rem; font-size: 0.8rem; color: var(--text-muted); border-top: 1px solid var(--border); margin-top: 4rem; }
  footer .heart { color: var(--red); }
  @media (max-width: 600px) { header { padding: 0 1rem; } main { padding: 2rem 1rem; } .panel-hero h1 { font-size: 1.5rem; } .tab-row { padding: 0 1rem; } .row-label { min-width: 60px; font-size: 0.65rem; } }
</style>
</head>
<body>
<header>
  <a href="#" class="logo">
    <svg viewBox="0 0 236 58" xmlns="http://www.w3.org/2000/svg" height="36">
      <rect x="2" y="5" width="22" height="7" rx="3" fill="#1a1a1a"/>
      <rect x="8" y="12" width="10" height="31" fill="#1a1a1a"/>
      <rect x="2" y="43" width="22" height="7" rx="3" fill="#1a1a1a"/>
      <g transform="translate(30, 5)">
        <path d="M22,7.5 C22,7.5 17.5,1 10.5,1 C4.7,1 0,5.8 0,11.5 C0,21 22,44 22,44 C22,44 44,21 44,11.5 C44,5.8 39.3,1 33.5,1 C26.5,1 22,7.5 22,7.5 Z" fill="#E94C3D"/>
        <path d="M22,10 L39,27 H22 Z" fill="white" opacity="0.97"/>
      </g>
      <text x="82" y="50" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-weight="900" font-size="46" fill="#1a1a1a" letter-spacing="1">仕組み</text>
    </svg>
  </a>
  <nav class="header-nav">
    <a href="https://github.com/kaiyoshida0318/iloveshikumi" target="_blank">GitHub</a>
  </nav>
</header>
<div class="tab-section">
  <div class="tab-row">
    <span class="row-label before">【出品前】</span>
    <div class="tab active" data-panel="set-code" onclick="switchTab(this)">📦 セット商品コード作成</div>
  </div>
  <div class="tab-row">
    <span class="row-label after">【出品後】</span>
    <div class="tab" data-panel="ranking-data" onclick="switchTab(this)">📊 商品・ランキングデータ作成</div>
  </div>
</div>
<main>
  <div class="tool-panel active" id="panel-set-code">
    <div class="panel-hero">
      <h1>セット商品コード作成</h1>
      <p>複数の商品コードからセット商品用のコードを自動生成します。</p>
      <div class="tag-row"><span class="tag">一括生成</span><span class="tag">CSV出力</span></div>
    </div>
    <div class="dropzone">
      <div class="dz-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
        </svg>
      </div>
      <div class="dz-label">ファイルをドロップ、または選択</div>
      <div class="dz-sub">CSV, Excel 対応</div>
      <button class="btn-select">ファイルを選択</button>
    </div>
  </div>
  <div class="tool-panel" id="panel-ranking-data">
    <div class="panel-hero">
      <h1>商品・ランキングデータ作成</h1>
      <p>出品後の商品データやランキング情報を整形・集計して出力します。</p>
      <div class="tag-row"><span class="tag">ランキング集計</span><span class="tag">データ整形</span><span class="tag">CSV出力</span></div>
    </div>
    <div class="dropzone">
      <div class="dz-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
      </div>
      <div class="dz-label">ファイルをドロップ、または選択</div>
      <div class="dz-sub">CSV, Excel 対応</div>
      <button class="btn-select">ファイルを選択</button>
    </div>
  </div>
</main>
<footer>
  <span>©2025 i<span class="heart">❤</span>仕組み — あなたの業務ツール</span>
</footer>
<script>
function switchTab(el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tool-panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  const panel = document.getElementById('panel-' + el.dataset.panel);
  if (panel) panel.classList.add('active');
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I❤仕組み</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --red: #E94C3D; --red-light: #ffeeed; --bg: #f7f5f2; --surface: #ffffff; --text: #1a1a1a; --text-muted: #6b6b6b; --border: #e0ddd8; --tab-hover-bg: #eeebe6; --radius: 12px; }
  body { font-family: 'DM Sans', 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; height: 60px; }
  .logo { display: flex; align-items: center; text-decoration: none; }
  .logo svg { display: block; }
  nav.header-nav a { font-size: 0.875rem; color: var(--text-muted); text-decoration: none; transition: color 0.15s; }
  nav.header-nav a:hover { color: var(--text); }

  .tab-section { background: var(--surface); border-bottom: 1px solid var(--border); }
  .tab-row { display: flex; align-items: stretch; padding: 0 2rem; overflow-x: auto; scrollbar-width: none; }
  .tab-row::-webkit-scrollbar { display: none; }
  .tab-row + .tab-row { border-top: 1px solid var(--border); }
  .row-label { display: flex; align-items: center; padding: 0 1rem 0 0; font-size: 0.72rem; font-weight: 700; white-space: nowrap; letter-spacing: 0.4px; border-right: 1px solid var(--border); margin-right: 0.5rem; min-width: 72px; }
  .row-label.before { color: #2563eb; }
  .row-label.after { color: #16a34a; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 0 1.1rem; height: 44px; font-size: 0.875rem; font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 2.5px solid transparent; transition: color 0.15s, border-color 0.15s, background 0.15s; white-space: nowrap; user-select: none; }
  .tab:hover { color: var(--text); background: var(--tab-hover-bg); }
  .tab.active { color: var(--red); border-bottom-color: var(--red); }

  main { max-width: 860px; margin: 0 auto; padding: 2.5rem 2rem; }
  .tool-panel { display: none; animation: fadeIn 0.2s ease; }
  .tool-panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* ── フォームセクション ── */
  .form-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 1.5rem; overflow: hidden; }
  .form-section-header { display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.25rem; background: var(--bg); border-bottom: 1px solid var(--border); font-size: 0.8rem; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; }
  .form-section-header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }

  .form-table { width: 100%; border-collapse: collapse; }
  .form-table tr { border-bottom: 1px solid var(--border); }
  .form-table tr:last-child { border-bottom: none; }
  .form-table td { padding: 0.7rem 1.25rem; vertical-align: middle; }
  .form-table td.label { width: 140px; font-size: 0.85rem; font-weight: 600; color: var(--text); white-space: nowrap; }
  .form-table td.input { }

  /* インプット */
  .form-table input[type="text"],
  .form-table input[type="url"],
  .form-table input[type="number"],
  .form-table select {
    width: 100%;
    height: 36px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.875rem;
    font-family: inherit;
    color: var(--text);
    background: var(--surface);
    transition: border-color 0.15s, box-shadow 0.15s;
    outline: none;
  }
  .form-table input:focus,
  .form-table select:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(233,76,61,0.1);
  }
  .form-table select { cursor: pointer; }

  /* 送信エリア */
  .form-actions { display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem; }
  .btn-primary { background: var(--red); color: #fff; border: none; border-radius: 8px; padding: 0.65rem 1.75rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: opacity 0.15s; }
  .btn-primary:hover { opacity: 0.88; }
  .btn-secondary { background: transparent; color: var(--text-muted); border: 1px solid var(--border); border-radius: 8px; padding: 0.65rem 1.25rem; font-size: 0.9rem; font-weight: 500; cursor: pointer; font-family: inherit; transition: background 0.15s; }
  .btn-secondary:hover { background: var(--tab-hover-bg); }

  /* ライバルセクション 複数 */
  .rival-block { margin-bottom: 1rem; }
  .rival-block-header { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 1.25rem; background: #f0f4ff; border-bottom: 1px solid var(--border); }
  .rival-block-title { font-size: 0.8rem; font-weight: 700; color: #2563eb; }
  .btn-add-rival { background: none; border: 1px solid #2563eb; color: #2563eb; border-radius: 6px; padding: 0.3rem 0.8rem; font-size: 0.78rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.15s; }
  .btn-add-rival:hover { background: #eff6ff; }
  .btn-remove-rival { background: none; border: none; color: var(--text-muted); font-size: 1rem; cursor: pointer; padding: 0.2rem 0.5rem; border-radius: 4px; transition: background 0.15s; }
  .btn-remove-rival:hover { background: var(--red-light); color: var(--red); }

  footer { text-align: center; padding: 2rem; font-size: 0.8rem; color: var(--text-muted); border-top: 1px solid var(--border); margin-top: 4rem; }
  footer .heart { color: var(--red); }

  @media (max-width: 600px) {
    header { padding: 0 1rem; }
    main { padding: 1.5rem 1rem; }
    .tab-row { padding: 0 1rem; }
    .row-label { min-width: 60px; font-size: 0.65rem; }
    .form-table td.label { width: 100px; font-size: 0.8rem; }
  }
</style>
</head>
<body>

<header>
  <a href="#" class="logo">
    <svg viewBox="0 0 236 58" xmlns="http://www.w3.org/2000/svg" height="36">
      <rect x="2" y="5" width="22" height="7" rx="3" fill="#1a1a1a"/>
      <rect x="8" y="12" width="10" height="31" fill="#1a1a1a"/>
      <rect x="2" y="43" width="22" height="7" rx="3" fill="#1a1a1a"/>
      <g transform="translate(30, 5)">
        <path d="M22,7.5 C22,7.5 17.5,1 10.5,1 C4.7,1 0,5.8 0,11.5 C0,21 22,44 22,44 C22,44 44,21 44,11.5 C44,5.8 39.3,1 33.5,1 C26.5,1 22,7.5 22,7.5 Z" fill="#E94C3D"/>
        <path d="M22,10 L39,27 H22 Z" fill="white" opacity="0.97"/>
      </g>
      <text x="82" y="50" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-weight="900" font-size="46" fill="#1a1a1a" letter-spacing="1">仕組み</text>
    </svg>
  </a>
  <nav class="header-nav">
    <a href="https://github.com/kaiyoshida0318/iloveshikumi" target="_blank">GitHub</a>
  </nav>
</header>

<div class="tab-section">
  <div class="tab-row">
    <span class="row-label before">【出品前】</span>
    <div class="tab" data-panel="set-code" onclick="switchTab(this)">📦 セット商品コード作成</div>
  </div>
  <div class="tab-row">
    <span class="row-label after">【出品後】</span>
    <div class="tab active" data-panel="ranking-data" onclick="switchTab(this)">📊 商品・ランキングデータ作成</div>
  </div>
</div>

<main>

  <!-- Panel: セット商品コード作成 -->
  <div class="tool-panel" id="panel-set-code">
    <div class="form-section">
      <div class="form-section-header"><span class="dot"></span>セット商品コード作成</div>
      <table class="form-table">
        <tr><td class="label">ファイル</td><td class="input"><input type="text" placeholder="CSV / Excel をドロップまたは選択"></td></tr>
      </table>
    </div>
  </div>

  <!-- Panel: 商品・ランキングデータ作成 -->
  <div class="tool-panel active" id="panel-ranking-data">

    <!-- 基本情報 -->
    <div class="form-section">
      <div class="form-section-header"><span class="dot"></span>基本情報</div>
      <table class="form-table">
        <tr>
          <td class="label">商品管理番号</td>
          <td class="input"><input type="text" id="mgmt-no" placeholder="例: ABC-001"></td>
        </tr>
        <tr>
          <td class="label">商品番号</td>
          <td class="input"><input type="text" id="product-no" placeholder="例: 12345678"></td>
        </tr>
        <tr>
          <td class="label">商品名</td>
          <td class="input"><input type="text" id="product-name" placeholder="商品名を入力"></td>
        </tr>
        <tr>
          <td class="label">ショップ名</td>
          <td class="input">
            <select id="shop-name">
              <option value="yukaiya">ゆかい屋</option>
              <option value="kairy">KAIRY</option>
            </select>
          </td>
        </tr>
      </table>
    </div>

    <!-- ライバル -->
    <div class="form-section">
      <div class="form-section-header" style="justify-content: space-between;">
        <span style="display:flex;align-items:center;gap:0.5rem;"><span class="dot" style="background:#2563eb"></span>ライバル</span>
        <button class="btn-add-rival" onclick="addRival()">＋ ライバルを追加</button>
      </div>
      <div id="rival-list">
        <!-- ライバル1 (初期表示) -->
        <div class="rival-block" id="rival-1">
          <div class="rival-block-header">
            <span class="rival-block-title">ライバル 1</span>
            <button class="btn-remove-rival" onclick="removeRival(1)" title="削除">✕</button>
          </div>
          <table class="form-table">
            <tr>
              <td class="label">分類</td>
              <td class="input">
                <select class="rival-category">
                  <option value="yukaiya">ゆかい屋</option>
                  <option value="kairy">KAIRY</option>
                </select>
              </td>
            </tr>
            <tr>
              <td class="label">ショップ名</td>
              <td class="input">
                <select class="rival-shop">
                  <option value="yukaiya">ゆかい屋</option>
                  <option value="kairy">KAIRY</option>
                </select>
              </td>
            </tr>
            <tr>
              <td class="label">商品名</td>
              <td class="input"><input type="text" class="rival-name" placeholder="ライバル商品名"></td>
            </tr>
            <tr>
              <td class="label">商品URL</td>
              <td class="input"><input type="url" class="rival-url" placeholder="https://..."></td>
            </tr>
            <tr>
              <td class="label">weeklyランク</td>
              <td class="input"><input type="number" class="rival-rank" placeholder="例: 15" min="1"></td>
            </tr>
          </table>
        </div>
      </div>
    </div>

    <!-- アクション -->
    <div class="form-actions">
      <button class="btn-secondary" onclick="clearForm()">クリア</button>
      <button class="btn-primary" onclick="submitForm()">データを作成</button>
    </div>

  </div>
</main>

<footer>
  <span>©2025 i<span class="heart">❤</span>仕組み — あなたの業務ツール</span>
</footer>

<script>
let rivalCount = 1;

function switchTab(el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tool-panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  const panel = document.getElementById('panel-' + el.dataset.panel);
  if (panel) panel.classList.add('active');
}

function addRival() {
  rivalCount++;
  const block = document.createElement('div');
  block.className = 'rival-block';
  block.id = 'rival-' + rivalCount;
  block.innerHTML = `
    <div class="rival-block-header">
      <span class="rival-block-title">ライバル ${rivalCount}</span>
      <button class="btn-remove-rival" onclick="removeRival(${rivalCount})" title="削除">✕</button>
    </div>
    <table class="form-table">
      <tr><td class="label">分類</td><td class="input"><select class="rival-category"><option value="yukaiya">ゆかい屋</option><option value="kairy">KAIRY</option></select></td></tr>
      <tr><td class="label">ショップ名</td><td class="input"><select class="rival-shop"><option value="yukaiya">ゆかい屋</option><option value="kairy">KAIRY</option></select></td></tr>
      <tr><td class="label">商品名</td><td class="input"><input type="text" class="rival-name" placeholder="ライバル商品名"></td></tr>
      <tr><td class="label">商品URL</td><td class="input"><input type="url" class="rival-url" placeholder="https://..."></td></tr>
      <tr><td class="label">weeklyランク</td><td class="input"><input type="number" class="rival-rank" placeholder="例: 15" min="1"></td></tr>
    </table>
  `;
  document.getElementById('rival-list').appendChild(block);
}

function removeRival(id) {
  const block = document.getElementById('rival-' + id);
  if (block) block.remove();
  renumberRivals();
}

function renumberRivals() {
  document.querySelectorAll('.rival-block').forEach((block, i) => {
    const title = block.querySelector('.rival-block-title');
    if (title) title.textContent = 'ライバル ' + (i + 1);
  });
}

function clearForm() {
  document.querySelectorAll('#panel-ranking-data input, #panel-ranking-data select').forEach(el => {
    if (el.tagName === 'SELECT') el.selectedIndex = 0;
    else el.value = '';
  });
}

function submitForm() {
  alert('データ作成機能は実装予定です。');
}
</script>
</body>
</html>
